name: adapter-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - name: Install adapter test dependencies
        shell: Rscript {0}
        run: |
          install.packages(
            c("BiocManager", "optparse"),
            repos = "https://cloud.r-project.org"
          )
          BiocManager::install(
            "limma",
            version = "3.20",
            ask = FALSE,
            update = FALSE
          )
      - name: Run adapter contract checks
        run: bash tests/run-tests.sh
