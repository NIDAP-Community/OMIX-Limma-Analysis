name: adapter-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::optparse
            bioc::limma
      - name: Run adapter contract checks
        run: bash tests/run-tests.sh
